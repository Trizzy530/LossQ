name: LossQ quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile changed application modules
        run: >-
          python -m py_compile
          backend/app/main.py
          backend/app/routes/review.py
          backend/app/routes/upload_v2.py
          backend/app/routes/loss_intelligence.py
          backend/app/models/underwriting_rule_set.py
          backend/app/services/loss_intelligence_guard.py
          backend/app/services/review_confirmation.py
          backend/app/services/source_evidence.py
          backend/app/services/underwriting_intelligence.py
          backend/app/services/schema_maintenance.py
      - name: Run backend regression suite
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and type-check
        run: npm run build
